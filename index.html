<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escape Missions</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #111; /* fallback color */
      background-image: radial-gradient(#222 1px, transparent 1px),
                        radial-gradient(#222 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }

    .logo-container {
      text-align: center;
      flex: 1; /* take up space so footer stays at bottom */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      width: 70%;      /* always half of the parent width */
  max-width: 500px;	/*upper bound*/
      height: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .logo-container img:hover {
      transform: scale(1.05);
    }

   /* Keep page content above the fixed bar */
body { padding-bottom: 12vh; }

/* Tab bar: fluid width and spacing */
.tabbar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background-color: #222;
  border-top: 2px solid #444;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 1000;

  /* fluid padding + safe area for iPhone notches */
  padding: clamp(10px, 2.5vh, 18px) clamp(8px, 3vw, 20px);
  padding-bottom: max(clamp(10px, 2.5vh, 18px), env(safe-area-inset-bottom, 0px));
}

/* Tab links: fluid text size + finger-friendly targets */
.tabbar a {
  color: #eee;
  text-decoration: none;
  flex: 1;
  text-align: center;

  /* scales between 14px and 20px based on viewport width */
  font-size: clamp(14px, 2.5vw, 20px);

  /* accessible tap target */
  padding: 10px 0;
  min-height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.3s ease, opacity 0.3s ease;
}

.tabbar a:hover,
.tabbar a:focus { color: #fff; opacity: 0.95; }

  </style>
</head>
<body>
  <div class="logo-container">
    <a href="ebook.html">
      <img src="EM_logo2.png" alt="Escape Missions Logo">
    </a>
  </div>

  <!-- Bottom tab bar -->
  <div class="tabbar">
    <a href="aboutus.html">About Us</a>
    <a href="threeinone.html">Three In One</a>
    <a href="believe.html">What We Believe</a>
    <a href="ebook.html">eBooks</a>
    <a href="freeworksheets.html">Free Worksheets</a>
  </div>
</body>
</html>
